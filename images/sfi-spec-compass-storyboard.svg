<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">Six-panel storyboard for the Plain-language SFI Spec Compass</title>
<desc id="desc">Six panels show a racer asking a plain-language question, clarifying context, reviewing traceable results, opening the official source, and safely recovering from an unclear query.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#102b32"/></linearGradient>
  <style>
    .panel{fill:#111a2a;stroke:#30435d;stroke-width:2}.num{fill:#70e6d1;font:700 17px Arial}.head{fill:#f7fbff;font:700 25px Arial}.body{fill:#b7c4d6;font:17px Arial}.tiny{fill:#8fa2ba;font:14px Arial}.ui{fill:#0a111d;stroke:#405574;stroke-width:2}.accent{fill:#70e6d1}.blue{fill:#78a9ff}.label{fill:#07131a;font:700 14px Arial}.white{fill:#f7fbff;font:16px Arial}.line{stroke:#70e6d1;stroke-width:3;stroke-linecap:round}
  </style>
</defs>
<rect width="1600" height="950" fill="url(#bg)"/>
<text x="70" y="70" fill="#70e6d1" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PLAIN-LANGUAGE SFI SPEC COMPASS</text>
<text x="70" y="116" fill="#f7fbff" font-family="Arial, sans-serif" font-size="38" font-weight="800">From a practical question to a traceable official source</text>
<text x="70" y="151" fill="#aebdd0" font-family="Arial, sans-serif" font-size="18">Six-screen ideation storyboard · no product implementation</text>

<g transform="translate(55 190)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">01 · GAIN ATTENTION</text>
  <text class="head" x="24" y="76">The question</text>
  <circle cx="102" cy="166" r="52" fill="#22314a"/>
  <path d="M64 170c8-42 70-49 79-9l-7 26H70z" fill="#eaf2ff"/>
  <path d="M68 158c16-20 47-27 70-9l-5-24c-20-20-53-16-65 7z" fill="#78a9ff"/>
  <rect x="44" y="220" width="130" height="54" rx="20" fill="#26364f"/>
  <rect x="196" y="112" width="243" height="104" rx="16" class="ui"/>
  <text class="white" x="215" y="145">“Which safety information</text>
  <text class="white" x="215" y="172">applies to my restraint?”</text>
  <text class="tiny" x="215" y="199">I do not know the spec number.</text>
  <text class="body" x="24" y="305">A practical need starts the search.</text>
</g>

<g transform="translate(562 190)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">02 · OVERVIEW</text>
  <text class="head" x="24" y="76">Set expectations</text>
  <rect x="25" y="102" width="425" height="160" rx="16" class="ui"/>
  <circle cx="61" cy="141" r="18" fill="#183e42"/>
  <text x="61" y="147" text-anchor="middle" fill="#70e6d1" font-family="Arial" font-size="19" font-weight="700">i</text>
  <text class="white" x="93" y="136">This tool helps you find sources.</text>
  <text class="body" x="45" y="181">• It does not certify equipment.</text>
  <text class="body" x="45" y="211">• It does not replace official text.</text>
  <rect x="286" y="224" width="140" height="24" rx="12" class="accent"/>
  <text class="label" x="321" y="241">START SEARCH</text>
  <text class="body" x="24" y="305">Limits are visible before any result.</text>
</g>

<g transform="translate(1069 190)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">03 · ASK + CLARIFY</text>
  <text class="head" x="24" y="76">Use everyday language</text>
  <rect x="25" y="103" width="425" height="66" rx="14" class="ui"/>
  <circle cx="55" cy="136" r="11" fill="none" stroke="#70e6d1" stroke-width="3"/>
  <line x1="63" y1="145" x2="72" y2="154" class="line"/>
  <text class="white" x="88" y="142">restraint inspection information</text>
  <text class="tiny" x="28" y="199">Help us narrow the meaning:</text>
  <rect x="28" y="215" width="122" height="32" rx="16" fill="#183e42"/>
  <text x="89" y="236" text-anchor="middle" fill="#70e6d1" font-family="Arial" font-size="14">Equipment</text>
  <rect x="160" y="215" width="122" height="32" rx="16" fill="#17253a"/>
  <text x="221" y="236" text-anchor="middle" fill="#a9c4ef" font-family="Arial" font-size="14">Use case</text>
  <rect x="292" y="215" width="130" height="32" rx="16" fill="#17253a"/>
  <text x="357" y="236" text-anchor="middle" fill="#a9c4ef" font-family="Arial" font-size="14">Question type</text>
  <text class="body" x="24" y="305">The user confirms context, not jargon.</text>
</g>

<g transform="translate(55 550)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">04 · TRACEABLE RESULTS</text>
  <text class="head" x="24" y="76">Explain every match</text>
  <rect x="24" y="101" width="427" height="136" rx="16" class="ui"/>
  <rect x="40" y="117" width="92" height="24" rx="12" fill="#183e42"/>
  <text x="86" y="134" text-anchor="middle" fill="#70e6d1" font-family="Arial" font-size="12" font-weight="700">BEST MATCH</text>
  <text class="white" x="40" y="170">Specification title + number</text>
  <text class="tiny" x="40" y="198">Why it matched · revision · checked date</text>
  <rect x="302" y="198" width="128" height="25" rx="12" class="blue"/>
  <text class="label" x="323" y="216">VIEW SOURCE ↗</text>
  <text class="body" x="24" y="275">No answer appears without a source.</text>
  <text class="tiny" x="24" y="303">Optional audio reads the same visible text.</text>
</g>

<g transform="translate(562 550)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">05 · OFFICIAL SOURCE</text>
  <text class="head" x="24" y="76">Verify before acting</text>
  <rect x="25" y="101" width="425" height="166" rx="16" fill="#f4f7fb"/>
  <rect x="25" y="101" width="425" height="36" rx="16" fill="#dce6f4"/>
  <circle cx="48" cy="119" r="5" fill="#ef6b6b"/><circle cx="66" cy="119" r="5" fill="#e8b75c"/><circle cx="84" cy="119" r="5" fill="#6fcf97"/>
  <text x="48" y="167" fill="#162033" font-family="Arial" font-size="18" font-weight="700">Official document title</text>
  <text x="48" y="195" fill="#52617a" font-family="Arial" font-size="14">Effective date · revision · relevant section</text>
  <line x1="48" y1="218" x2="405" y2="218" stroke="#b4c0d1" stroke-width="2"/>
  <line x1="48" y1="238" x2="330" y2="238" stroke="#c8d1de" stroke-width="2"/>
  <text class="body" x="24" y="303">The controlling document stays primary.</text>
</g>

<g transform="translate(1069 550)">
  <rect class="panel" width="475" height="330" rx="20"/>
  <text class="num" x="24" y="38">06 · SAFE RECOVERY</text>
  <text class="head" x="24" y="76">No confident match</text>
  <polygon points="62,105 88,150 36,150" fill="#ffbd6c"/>
  <text x="62" y="143" text-anchor="middle" fill="#18202d" font-family="Arial" font-size="20" font-weight="800">!</text>
  <text class="white" x="105" y="128">We need more information.</text>
  <text class="body" x="25" y="184">• Refine the equipment category</text>
  <text class="body" x="25" y="216">• Try a specification number</text>
  <text class="body" x="25" y="248">• Browse the official directory</text>
  <rect x="287" y="266" width="163" height="26" rx="13" class="accent"/>
  <text class="label" x="315" y="284">REFINE QUESTION</text>
  <text class="tiny" x="24" y="313">The tool never invents a confident answer.</text>
</g>
<text x="800" y="925" text-anchor="middle" fill="#8fa2ba" font-family="Arial, sans-serif" font-size="16">Every result explains why it matched, shows uncertainty, and leads to an official source.</text>
</svg>