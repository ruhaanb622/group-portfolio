<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Motorsports Safety Learning Hub six-panel storyboard</title>
  <desc id="desc">A six-step learning flow teaches a beginner that an SFI label begins a safety check, but the label date, current SFI information, and event rules must also be checked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17263d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#f04444"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62b6ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity=".22"/>
    </filter>
    <clipPath id="card1"><rect x="40" y="145" width="370" height="305" rx="22"/></clipPath>
    <clipPath id="card2"><rect x="455" y="145" width="370" height="305" rx="22"/></clipPath>
    <clipPath id="card3"><rect x="870" y="145" width="370" height="305" rx="22"/></clipPath>
    <clipPath id="card4"><rect x="40" y="500" width="370" height="305" rx="22"/></clipPath>
    <clipPath id="card5"><rect x="455" y="500" width="370" height="305" rx="22"/></clipPath>
    <clipPath id="card6"><rect x="870" y="500" width="370" height="305" rx="22"/></clipPath>
    <pattern id="checks" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect width="19" height="19" fill="#f8fafc" opacity=".14"/>
      <rect x="19" y="19" width="19" height="19" fill="#f8fafc" opacity=".14"/>
    </pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .num{font-size:22px;font-weight:800;fill:white;text-anchor:middle}
      .tag{font-size:12px;font-weight:800;letter-spacing:.3px}
      .headline{font-size:22px;font-weight:900;fill:#111827;letter-spacing:.3px}
      .sub{font-size:14.5px;fill:#526079}
      .tiny{font-size:10px;font-weight:700;letter-spacing:.3px}
      .ui{font-size:12px;font-weight:800;fill:#172033}
    </style>
  </defs>

  <rect width="1280" height="900" rx="28" fill="url(#bg)"/>
  <rect x="0" y="105" width="1280" height="7" fill="url(#orange)"/>
  <text x="52" y="49" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing=".8">MOTORSPORTS SAFETY LEARNING HUB</text>
  <text x="52" y="80" font-size="18" font-weight="700" fill="#ffb4a8">A 3-minute challenge: does a safety label finish the check?</text>
  <rect x="950" y="19" width="285" height="72" rx="13" fill="url(#checks)"/>
  <g transform="translate(962 29)">
    <rect width="84" height="23" rx="11" fill="#24334a"/><text x="42" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#dbeafe">AUDIO + TEXT</text>
    <rect x="92" width="77" height="23" rx="11" fill="#24334a"/><text x="130.5" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#dbeafe">KEYBOARD</text>
    <rect x="177" width="66" height="23" rx="11" fill="#24334a"/><text x="210" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#dbeafe">MOBILE</text>
  </g>

  <!-- Card 1 -->
  <g clip-path="url(#card1)">
    <rect x="40" y="145" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="76" cy="181" r="20" fill="#f04444"/><text class="num" x="76" y="189">1</text>
    <rect x="105" y="162" width="136" height="37" rx="19" fill="#fee2e2"/><text class="tag" x="173" y="185" text-anchor="middle" fill="#b91c1c">GAIN ATTENTION</text>

    <g filter="url(#shadow)">
      <path d="M118 223 L157 310" stroke="#1f2937" stroke-width="25" stroke-linecap="round"/>
      <path d="M206 223 L167 310" stroke="#1f2937" stroke-width="25" stroke-linecap="round"/>
      <circle cx="162" cy="306" r="29" fill="#273449" stroke="#64748b" stroke-width="5"/>
      <circle cx="162" cy="306" r="10" fill="#f8fafc"/>
      <rect x="130" y="236" width="64" height="48" rx="7" fill="#f8fafc" stroke="#f04444" stroke-width="3"/>
      <text x="162" y="254" text-anchor="middle" class="tiny" fill="#dc2626">SFI 16.1</text>
      <text x="162" y="270" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">DATE?</text>
    </g>
    <circle cx="292" cy="264" r="48" fill="#fff7ed" stroke="#ff7a18" stroke-width="5"/>
    <line x1="326" y1="298" x2="350" y2="322" stroke="#ff7a18" stroke-width="10" stroke-linecap="round"/>
    <text x="292" y="280" text-anchor="middle" font-size="48" font-weight="900" fill="#f59e0b">?</text>

    <text class="headline" x="69" y="386">A LABEL IS A CLUE</text>
    <text class="sub" x="69" y="413">It starts the check—it does not</text>
    <text class="sub" x="69" y="435">finish it.</text>
  </g>

  <!-- Card 2 -->
  <g clip-path="url(#card2)">
    <rect x="455" y="145" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="491" cy="181" r="20" fill="#f04444"/><text class="num" x="491" y="189">2</text>
    <rect x="520" y="162" width="92" height="37" rx="19" fill="#e0f2fe"/><text class="tag" x="566" y="185" text-anchor="middle" fill="#0369a1">OVERVIEW</text>

    <path d="M514 270 H766" stroke="#dbe4f0" stroke-width="12" stroke-linecap="round"/>
    <path d="M514 270 H640" stroke="url(#blue)" stroke-width="12" stroke-linecap="round"/>
    <g filter="url(#shadow)">
      <circle cx="514" cy="270" r="35" fill="#2563eb"/>
      <rect x="496" y="248" width="36" height="44" rx="5" fill="white"/>
      <text x="514" y="268" text-anchor="middle" font-size="9" font-weight="900" fill="#2563eb">SPEC</text>
      <text x="514" y="281" text-anchor="middle" font-size="8" font-weight="800" fill="#64748b">LABEL</text>
      <circle cx="640" cy="270" r="35" fill="#0ea5e9"/>
      <circle cx="640" cy="270" r="20" fill="white"/>
      <path d="M640 256v15l11 7" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="766" cy="270" r="35" fill="#e8eef7"/>
      <path d="M750 284h32v-26l-16-9-16 9z" fill="#64748b"/>
      <path d="M766 254v30" stroke="white" stroke-width="3"/>
    </g>
    <text x="514" y="326" text-anchor="middle" class="tiny" fill="#1d4ed8">LABEL</text>
    <text x="640" y="326" text-anchor="middle" class="tiny" fill="#0284c7">DATE</text>
    <text x="766" y="326" text-anchor="middle" class="tiny" fill="#64748b">SOURCE</text>

    <text class="headline" x="484" y="386">LEARN THE 3-CHECK</text>
    <text class="sub" x="484" y="413">Find the label, check the date,</text>
    <text class="sub" x="484" y="435">then verify the official source.</text>
  </g>

  <!-- Card 3 -->
  <g clip-path="url(#card3)">
    <rect x="870" y="145" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="906" cy="181" r="20" fill="#f04444"/><text class="num" x="906" y="189">3</text>
    <rect x="935" y="162" width="85" height="37" rx="19" fill="#ede9fe"/><text class="tag" x="977.5" y="185" text-anchor="middle" fill="#6d28d9">EXPLORE</text>

    <g filter="url(#shadow)">
      <rect x="925" y="218" width="260" height="121" rx="14" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/>
      <rect x="947" y="237" width="216" height="83" rx="9" fill="white" stroke="#9ac5ff" stroke-width="2"/>
      <text x="1055" y="259" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8">SAMPLE LABEL</text>
      <text x="1055" y="282" text-anchor="middle" font-size="19" font-weight="900" fill="#172033">SFI 16.1</text>
      <text x="1055" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">EXPIRES 03 / 2028</text>
    </g>
    <circle cx="949" cy="280" r="11" fill="#f04444"/><text x="949" y="284" text-anchor="middle" font-size="12" font-weight="900" fill="white">1</text>
    <circle cx="1162" cy="303" r="11" fill="#f04444"/><text x="1162" y="307" text-anchor="middle" font-size="12" font-weight="900" fill="white">2</text>

    <text class="headline" x="899" y="386">READ THE LABEL</text>
    <text class="sub" x="899" y="413">Select the spec number and date</text>
    <text class="sub" x="899" y="435">using tap, Tab, or Enter.</text>
  </g>

  <!-- Card 4 -->
  <g clip-path="url(#card4)">
    <rect x="40" y="500" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="76" cy="536" r="20" fill="#f04444"/><text class="num" x="76" y="544">4</text>
    <rect x="105" y="517" width="82" height="37" rx="19" fill="#dcfce7"/><text class="tag" x="146" y="540" text-anchor="middle" fill="#15803d">CHOOSE</text>

    <rect x="78" y="577" width="294" height="132" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="225" y="603" text-anchor="middle" font-size="14" font-weight="900" fill="#172033">A LABEL IS PRESENT.</text>
    <text x="225" y="623" text-anchor="middle" font-size="14" font-weight="900" fill="#172033">READY FOR THIS EVENT?</text>
    <rect x="95" y="642" width="112" height="43" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="151" y="668" text-anchor="middle" class="ui" fill="#b91c1c">YES</text>
    <rect x="221" y="642" width="133" height="43" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="240" cy="664" r="9" fill="#16a34a"/><path d="M235 664l4 4 7-9" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="296" y="668" text-anchor="middle" font-size="9.5" font-weight="900" fill="#166534">NEED MORE INFO</text>

    <text class="headline" x="69" y="741">MAKE THE CALL</text>
    <text class="sub" x="69" y="768">Use the evidence—not the badge.</text>
  </g>

  <!-- Card 5 -->
  <g clip-path="url(#card5)">
    <rect x="455" y="500" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="491" cy="536" r="20" fill="#f04444"/><text class="num" x="491" y="544">5</text>
    <rect x="520" y="517" width="96" height="37" rx="19" fill="#dbeafe"/><text class="tag" x="568" y="540" text-anchor="middle" fill="#1d4ed8">FEEDBACK</text>

    <g filter="url(#shadow)">
      <rect x="493" y="573" width="294" height="139" rx="16" fill="#effcf5" stroke="#16a374" stroke-width="3"/>
      <circle cx="526" cy="603" r="16" fill="#16a374"/><path d="M518 603l6 6 11-15" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <text x="553" y="608" font-size="14" font-weight="900" fill="#10644f">GOOD CHECK</text>
      <text x="515" y="635" font-size="11" font-weight="700" fill="#334155">A label identifies a standard.</text>
      <text x="515" y="654" font-size="11" font-weight="700" fill="#334155">Date + rules show what to check next.</text>
      <rect x="515" y="672" width="120" height="25" rx="8" fill="#2563eb"/><text x="575" y="689" text-anchor="middle" font-size="9" font-weight="900" fill="white">OPEN SFI LIST</text>
      <rect x="645" y="672" width="120" height="25" rx="8" fill="white" stroke="#2563eb"/><text x="705" y="689" text-anchor="middle" font-size="9" font-weight="900" fill="#1d4ed8">EVENT RULES</text>
    </g>

    <text class="headline" x="484" y="741">UNDERSTAND WHY</text>
    <text class="sub" x="484" y="768">The hub teaches. Official rules control.</text>
  </g>

  <!-- Card 6 -->
  <g clip-path="url(#card6)">
    <rect x="870" y="500" width="370" height="305" rx="22" fill="#fff" stroke="#d5deea" stroke-width="2"/>
    <circle cx="906" cy="536" r="20" fill="#f04444"/><text class="num" x="906" y="544">6</text>
    <rect x="935" y="517" width="125" height="37" rx="19" fill="#fff1c7"/><text class="tag" x="997.5" y="540" text-anchor="middle" fill="#a4490c">APPLICATION</text>

    <g filter="url(#shadow)">
      <rect x="920" y="576" width="114" height="137" rx="19" fill="#111827"/>
      <rect x="932" y="590" width="90" height="104" rx="10" fill="#f8fafc"/>
      <text x="977" y="610" text-anchor="middle" font-size="9" font-weight="900" fill="#475569">NEW ITEM</text>
      <rect x="943" y="620" width="68" height="12" rx="6" fill="#dbeafe"/>
      <rect x="943" y="641" width="68" height="12" rx="6" fill="#dbeafe"/>
      <rect x="943" y="662" width="68" height="20" rx="7" fill="#2563eb"/>
      <text x="977" y="676" text-anchor="middle" font-size="8" font-weight="900" fill="white">VERIFY</text>
      <circle cx="977" cy="703" r="4" fill="#64748b"/>
    </g>
    <path d="M1054 610h110M1054 649h110M1054 688h110" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="1070" cy="610" r="14" fill="#16a34a"/><path d="M1063 610l5 5 9-12" fill="none" stroke="white" stroke-width="3"/>
    <text x="1093" y="614" class="ui">LABEL</text>
    <circle cx="1070" cy="649" r="14" fill="#16a34a"/><path d="M1063 649l5 5 9-12" fill="none" stroke="white" stroke-width="3"/>
    <text x="1093" y="653" class="ui">DATE</text>
    <circle cx="1070" cy="688" r="14" fill="#2563eb"/><path d="M1062 688h16M1070 680v16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="1093" y="692" class="ui">SOURCE</text>

    <text class="headline" x="899" y="741">APPLY + VERIFY</text>
    <text class="sub" x="899" y="768">Repeat the check on a new item.</text>
  </g>

  <g transform="translate(453 836)">
    <circle cx="53" cy="12" r="5" fill="#f04444"/><circle cx="99" cy="12" r="5" fill="#f04444"/><circle cx="145" cy="12" r="5" fill="#f04444"/>
    <circle cx="191" cy="12" r="5" fill="#f04444"/><circle cx="237" cy="12" r="5" fill="#f04444"/><circle cx="283" cy="12" r="5" fill="#f04444"/>
  </g>
  <text x="640" y="876" text-anchor="middle" font-size="14" fill="#aebbd0">Storyboard concept for Issue #14 • ideation and peer testing only</text>
</svg>
