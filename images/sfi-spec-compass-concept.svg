<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Plain-language SFI Spec Compass concept</title>
<desc id="desc">A racer asks a practical safety question and receives source-first specification results with official links and clear limitations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1324"/><stop offset="1" stop-color="#102d35"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70e6d1"/><stop offset="1" stop-color="#78a9ff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="190" fill="#70e6d1" opacity=".08"/>
<circle cx="80" cy="620" r="230" fill="#78a9ff" opacity=".08"/>
<text x="70" y="74" fill="#70e6d1" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">IDEA 1 · SOURCE-FIRST SEARCH</text>
<text x="70" y="126" fill="#f8fbff" font-family="Arial, sans-serif" font-size="44" font-weight="800">Plain-language SFI Spec Compass</text>
<text x="70" y="165" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="21">Ask a practical question. Find the controlling source.</text>

<g transform="translate(70 222)">
  <circle cx="112" cy="105" r="74" fill="#202c40" stroke="#78a9ff" stroke-width="3"/>
  <path d="M62 110c6-58 94-69 109-14l-8 35H70z" fill="#e9f1ff"/>
  <path d="M67 100c19-27 62-39 96-13l-4-30c-24-29-74-26-92 9z" fill="#78a9ff"/>
  <rect x="56" y="145" width="113" height="112" rx="32" fill="#26364f"/>
  <rect x="139" y="175" width="88" height="130" rx="13" fill="#0b111e" stroke="#70e6d1" stroke-width="3" transform="rotate(-9 183 240)"/>
  <circle cx="183" cy="283" r="4" fill="#70e6d1"/>
  <text x="0" y="345" fill="#f8fbff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Racer / crew member</text>
  <text x="0" y="378" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="18">Knows the equipment problem,</text>
  <text x="0" y="404" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="18">not the formal specification term.</text>
</g>

<g transform="translate(390 210)" filter="url(#shadow)">
  <rect width="735" height="390" rx="24" fill="#111a2a" stroke="#33445f" stroke-width="2"/>
  <rect x="28" y="28" width="679" height="72" rx="15" fill="#0a101c" stroke="#70e6d1" stroke-width="2"/>
  <circle cx="62" cy="64" r="14" fill="none" stroke="#70e6d1" stroke-width="4"/>
  <line x1="72" y1="75" x2="84" y2="87" stroke="#70e6d1" stroke-width="4" stroke-linecap="round"/>
  <text x="105" y="72" fill="#f8fbff" font-family="Arial, sans-serif" font-size="22">What safety information applies to my restraint?</text>
  <text x="30" y="132" fill="#93a5bd" font-family="Arial, sans-serif" font-size="15">ASSISTED DISCOVERY · VERIFY WITH THE OFFICIAL SOURCE</text>

  <g transform="translate(28 154)">
    <rect width="679" height="92" rx="14" fill="#17253a" stroke="#78a9ff" stroke-width="2"/>
    <rect x="18" y="18" width="88" height="26" rx="13" fill="#183e42"/>
    <text x="33" y="37" fill="#70e6d1" font-family="Arial, sans-serif" font-size="13" font-weight="700">BEST MATCH</text>
    <text x="126" y="38" fill="#f8fbff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Specification title and number</text>
    <text x="18" y="70" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="16">Why it matched · source revision · last checked</text>
    <rect x="520" y="51" width="137" height="27" rx="13" fill="url(#accent)"/>
    <text x="541" y="70" fill="#07131a" font-family="Arial, sans-serif" font-size="13" font-weight="800">OFFICIAL SOURCE ↗</text>
  </g>

  <g transform="translate(28 260)">
    <rect width="679" height="92" rx="14" fill="#141f31" stroke="#33445f" stroke-width="2"/>
    <text x="18" y="34" fill="#f8fbff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Related specification or manufacturer page</text>
    <text x="18" y="65" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="16">Related topic · official link · clear uncertainty note</text>
    <text x="539" y="65" fill="#78a9ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">OPEN SOURCE ↗</text>
  </g>
</g>
<text x="600" y="646" text-anchor="middle" fill="#8fa1b9" font-family="Arial, sans-serif" font-size="15">Concept only · The tool supports discovery and never replaces an official specification or interpretation.</text>
</svg>