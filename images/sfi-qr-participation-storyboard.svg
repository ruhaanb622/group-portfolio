 <rect x="35" y="370" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
 <rect x="35" y="370" width="8" height="210" rx="4" fill="#22d3ee"/>
 <circle cx="75" cy="408" r="21" fill="#22d3ee"/><text x="75" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">3</text>
 <rect x="63" y="432" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <circle cx="131" cy="486" r="34" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M156 511l30 30" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="88" y="532" width="96" height="22" rx="11" fill="#13233e"/><circle cx="105" cy="543" r="5" fill="#22d3ee"/><rect x="116" y="539" width="55" height="8" rx="4" fill="#64748b"/>
 <text x="240" y="413" font-size="23" font-weight="700" fill="#f8fafc">Check official data</text>
 <text x="240" y="448" font-size="16" fill="#cbd5e1" font-weight="400">Search an SFI-authorized</text><text x="240" y="473" font-size="16" fill="#cbd5e1" font-weight="400">participation record and show</text><text x="240" y="498" font-size="16" fill="#cbd5e1" font-weight="400">the last-checked date.</text>
 <rect x="240" y="534" width="142" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="257" y="555" font-size="14" font-weight="700" fill="#22d3ee">SOURCE CHECK</text>
 </g><g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <rect x="615" y="370" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
 <rect x="615" y="370" width="8" height="210" rx="4" fill="#22d3ee"/>
 <circle cx="655" cy="408" r="21" fill="#22d3ee"/><text x="655" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">4</text>
 <rect x="643" y="432" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <rect x="662" y="440" width="108" height="112" rx="16" fill="#08101f" stroke="#334155" stroke-width="2"/>
    <circle cx="689" cy="470" r="12" fill="#22d3ee"/><path d="M683 470l5 5 9-11" stroke="#06111f" stroke-width="4" fill="none"/>
    <rect x="710" y="463" width="45" height="10" rx="5" fill="#64748b"/><rect x="676" y="494" width="80" height="9" rx="4" fill="#334155"/>
    <rect x="676" y="512" width="68" height="9" rx="4" fill="#334155"/><rect x="676" y="530" width="52" height="9" rx="4" fill="#22d3ee"/>
 <text x="820" y="413" font-size="23" font-weight="700" fill="#f8fafc">Read a limited result</text>
 <text x="820" y="448" font-size="16" fill="#cbd5e1" font-weight="400">Show Listed, Needs Review,</text><text x="820" y="473" font-size="16" fill="#cbd5e1" font-weight="400">or No Match with plain</text><text x="820" y="498" font-size="16" fill="#cbd5e1" font-weight="400">verification limits.</text>
 <rect x="820" y="534" width="196" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="837" y="555" font-size="14" font-weight="700" fill="#22d3ee">NOT AN ENDORSEMENT</text>
 </g><g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <rect x="35" y="610" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
 <rect x="35" y="610" width="8" height="210" rx="4" fill="#22d3ee"/>
 <circle cx="75" cy="648" r="21" fill="#22d3ee"/><text x="75" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">5</text>
 <rect x="63" y="672" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <path d="M98 684h58l24 24v84H98z" fill="#08101f" stroke="#64748b" stroke-width="3"/>
    <path d="M156 684v26h24M114 728h50M114 746h50M114 764h34" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="174" cy="774" r="18" fill="#22d3ee"/><path d="M167 774l5 5 9-11" stroke="#06111f" stroke-width="4" fill="none"/>
 <text x="240" y="653" font-size="23" font-weight="700" fill="#f8fafc">Open the source</text>
 <text x="240" y="688" font-size="16" fill="#cbd5e1" font-weight="400">Link to the current SFI spec</text><text x="240" y="713" font-size="16" fill="#cbd5e1" font-weight="400">and participating-manufacturer</text><text x="240" y="738" font-size="16" fill="#cbd5e1" font-weight="400">record for confirmation.</text>
 <rect x="240" y="774" width="187" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="257" y="795" font-size="14" font-weight="700" fill="#22d3ee">VERIFY OFFICIALLY</text>
 </g><g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <rect x="615" y="610" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
 <rect x="615" y="610" width="8" height="210" rx="4" fill="#22d3ee"/>
 <circle cx="655" cy="648" r="21" fill="#22d3ee"/><text x="655" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">6</text>
 <rect x="643" y="672" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <path d="M718 681L771 784H665Z" fill="#2a1b0a" stroke="#22d3ee" stroke-width="4"/>
    <path d="M718 714v34M718 764v2" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="820" y="653" font-size="23" font-weight="700" fill="#f8fafc">Recover safely</text>
 <text x="820" y="688" font-size="16" fill="#cbd5e1" font-weight="400">If missing, old, or unreadable,</text><text x="820" y="713" font-size="16" fill="#cbd5e1" font-weight="400">use manual search or contact</text><text x="820" y="738" font-size="16" fill="#cbd5e1" font-weight="400">SFI. Never guess.</text>
 <rect x="820" y="774" width="169" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="837" y="795" font-size="14" font-weight="700" fill="#22d3ee">STOP AND VERIFY</text>
 </g>
<text x="600" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b">Concept storyboard for team ideation • Official SFI sources remain controlling</text>
