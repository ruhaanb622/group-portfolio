 <circle cx="75" cy="168" r="21" fill="#22d3ee"/><text x="75" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">1</text>
 <rect x="63" y="192" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <rect x="78" y="196" width="116" height="116" rx="16" fill="#08101f" stroke="#334155" stroke-width="2"/>
