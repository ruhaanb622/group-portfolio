<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Idea 2 • SFI QR Participation Checker</title><desc id="desc">Fast reference lookup without implying endorsement or automatic certification Six-panel visual storyboard.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111827"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".28"/></filter></defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<text x="48" y="55" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Idea 2 • SFI QR Participation Checker</text>
<text x="48" y="88" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#94a3b8">Fast reference lookup without implying endorsement or automatic certification</text>
<g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <rect x="35" y="130" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
