    <rect x="94" y="268" width="28" height="28" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 254h16v16h14v26M136 288h12M166 254h12" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="240" y="173" font-size="23" font-weight="700" fill="#f8fafc">Scan the label</text>
 <text x="240" y="208" font-size="16" fill="#cbd5e1" font-weight="400">Buyer, racer, or inspector</text><text x="240" y="233" font-size="16" fill="#cbd5e1" font-weight="400">scans an authorized code</text><text x="240" y="258" font-size="16" fill="#cbd5e1" font-weight="400">or enters its identifier.</text>
 <rect x="240" y="294" width="142" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="257" y="315" font-size="14" font-weight="700" fill="#22d3ee">START LOOKUP</text>
 </g><g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <rect x="615" y="130" width="550" height="210" rx="20" fill="#101c31" stroke="#334155" stroke-width="2"/>
 <rect x="615" y="130" width="8" height="210" rx="4" fill="#22d3ee"/>
 <circle cx="655" cy="168" r="21" fill="#22d3ee"/><text x="655" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#071426">2</text>
 <rect x="643" y="192" width="150" height="128" rx="16" fill="#0b1527" stroke="#253550"/>
 <rect x="683" y="196" width="72" height="124" rx="14" fill="#08101f" stroke="#64748b" stroke-width="3"/>
    <rect x="693" y="214" width="52" height="72" rx="5" fill="#13233e"/><circle cx="719" cy="302" r="5" fill="#22d3ee"/>
    <path d="M703 232h32M703 246h24M703 260h30" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="820" y="173" font-size="23" font-weight="700" fill="#f8fafc">Confirm the match</text>
 <text x="820" y="208" font-size="16" fill="#cbd5e1" font-weight="400">Check manufacturer, model,</text><text x="820" y="233" font-size="16" fill="#cbd5e1" font-weight="400">spec number, and label date</text><text x="820" y="258" font-size="16" fill="#cbd5e1" font-weight="400">before continuing.</text>
 <rect x="820" y="294" width="151" height="30" rx="15" fill="#22d3ee" opacity=".18"/>
 <text x="837" y="315" font-size="14" font-weight="700" fill="#22d3ee">USER CONFIRMS</text>
